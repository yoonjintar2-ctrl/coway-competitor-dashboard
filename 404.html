<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>코웨이 경쟁사 분석 플랫폼</title>
<script>(function(){var p=location.pathname,m=p.match(/^(.*\/)n\/([^\/.]+)(?:\.html)?$/);
var root=m?m[1]:p.replace(/[^\/]*$/,'').replace(/(\/[^\/]+\/).*/,'$1');
location.replace(root+(m?'#news='+m[2]:''))})()</script></head><body></body></html>
